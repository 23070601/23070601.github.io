<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 3</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        form {
            width: 350px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        label {
            font-weight: bold;
        }

        input {
            padding: 8px;
            font-size: 14px;
        }

        #strength {
            font-weight: bold;
        }
    </style>
</head>
<body>

<form>
    <label>Username</label>
    <input type="text"
           id="username"
           minlength="5"
           maxlength="15"
           required>
    <small id="usernameMessage" style="color: red;"></small>

    <label>Password</label>
    <input type="password"
           id="password"
           required>

    <small id="strength">Password strength: </small>

    <label>Confirm Password</label>
    <input type="password"
           id="confirmPassword"
           required>
    <small id="matchMessage" style="color: red;"></small>

    <label>Profile Picture</label>
    <input type="file"
           accept=".jpg,.png">

</form>

<script>
    const usernameInput = document.getElementById("username");
    const usernameMessage = document.getElementById("usernameMessage");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const strengthText = document.getElementById("strength");
    const matchMessage = document.getElementById("matchMessage");

    /*usename*/
    usernameInput.addEventListener("input", function () {
        const value = usernameInput.value;

        if (value.length === 0) {
            usernameMessage.textContent = "";
        }
        else if (value.length < 5) {
            usernameMessage.textContent = "✗ Username must be at least 5 characters";
            usernameMessage.style.color = "red";
        }
        else if (value.length > 15) {
            usernameMessage.textContent = "✗ Username must not exceed 15 characters";
            usernameMessage.style.color = "red";
        }
        else {
            usernameMessage.textContent = "✓ Valid username";
            usernameMessage.style.color = "green";
        }
    });

    /*password*/
    passwordInput.addEventListener("input", function () {
        const value = passwordInput.value;

        const hasLetter = /[a-zA-Z]/.test(value);
        const hasNumber = /[0-9]/.test(value);

        if (value.length < 6) {
            strengthText.textContent = "Password strength: Weak";
            strengthText.style.color = "red";
        } 
        else if (hasLetter && hasNumber) {
            strengthText.textContent = "Password strength: Strong";
            strengthText.style.color = "green";
        } 
        else {
            strengthText.textContent = "Password strength: Medium";
            strengthText.style.color = "orange";
        }

        checkPasswordMatch();
    });

    confirmPasswordInput.addEventListener("input", checkPasswordMatch);

    function checkPasswordMatch() {
        if (passwordInput.value === confirmPasswordInput.value && confirmPasswordInput.value !== "") {
            matchMessage.textContent = "✓ Password match";
            matchMessage.style.color = "green";
        } 
        else if (confirmPasswordInput.value !== "") {
            matchMessage.textContent = "✗ Password does not match";
            matchMessage.style.color = "red";
        }
        else {
            matchMessage.textContent = "";
        }
    }
</script>

</body>
</html>
