<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 2</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 15px;
            border: 1px solid #ccc;
            background-color: #f5f5f5;
            cursor: pointer;
        }

        .tab.active {
            background-color: #4caf50;
            color: white;
            font-weight: bold;
        }

        .tab.active::after {
            content: " →"; 
        }

        .tab-content {
            display: none;
            border: 1px solid #ccc;
            padding: 15px;
        }

        .tab-content.active {
            display: block;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('features')">Features &reg;</div>
        <div class="tab" onclick="switchTab('pricing')">Pricing &euro;</div>
        <div class="tab" onclick="switchTab('reviews')">Reviews</div>
        <div class="tab" onclick="switchTab('support')">Support</div>
    </div>

    <div id="features" class="tab-content active">
        <p>Product features and specifications.</p>
    </div>

    <div id="pricing" class="tab-content">
        <p>Pricing plans and offers.</p>
    </div>

    <div id="reviews" class="tab-content">
        <p>User reviews and ratings.</p>
    </div>

    <div id="support" class="tab-content">
        <p>Support and help information.</p>
    </div>

    <script>
        function switchTab(tabId) {
            const tabs = document.getElementsByClassName("tab");
            const contents = document.getElementsByClassName("tab-content");

            for (let i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove("active");
                contents[i].classList.remove("active");
            }

            event.target.classList.add("active"); 
            document.getElementById(tabId).classList.add("active");
        }
    </script>

</body>
</html>
