<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restaurant Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h2 {
            border-bottom: 2px solid #ccc;
            margin-top: 30px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 6px 0;
        }

        .price {
            float: right;
            font-weight: bold;
        }

        button {
            padding: 10px 15px;
            margin-bottom: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <button onclick="filterMenu()">Filter Menu (Vegetarian)</button>

    <!-- Appetizers -->
    <h2>Appetizers &reg;</h2>
    <ul>
        <li class="menu-item vegetarian">Spring Rolls <span class="price">&ge; 5</span></li>
        <li class="menu-item">Chicken Wings <span class="price">&ge; 7</span></li>
    </ul>

    <!-- Main Course -->
    <h2>Main Course &sect;</h2>
    <ul>
        <li class="menu-item vegetarian">Vegetable Curry <span class="price">&ge; 12</span></li>
        <li class="menu-item">Grilled Steak <span class="price">&ge; 18</span></li>
    </ul>

    <!-- Desserts -->
    <h2>Desserts</h2>
    <ul>
        <li class="menu-item vegetarian">Fruit Salad <span class="price">&ge; 6</span></li>
        <li class="menu-item">Chocolate Cake <span class="price">&ge; 7</span></li>
    </ul>

    <!-- Drinks -->
    <h2>Drinks</h2>
    <ul>
        <li class="menu-item vegetarian">Fresh Juice <span class="price">&ge; 4</span></li>
        <li class="menu-item">Coffee <span class="price"> &ge; 3</span></li>
    </ul>

    <script>
        let showVegetarianOnly = false;

        function filterMenu() {
            const items = document.getElementsByClassName("menu-item");

            showVegetarianOnly = !showVegetarianOnly;

            for (let i = 0; i < items.length; i++) {
                if (showVegetarianOnly && !items[i].classList.contains("vegetarian")) {
                    items[i].style.display = "none";
                } else {
                    items[i].style.display = "block";
                }
            }
        }
    </script>

</body>
</html>
